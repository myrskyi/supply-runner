<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Supply Runner</title>
<style>
:root { --bg:#f3f4f6; --card:#fff; --ink:#111827; --muted:#6b7280; --line:#e5e7eb; --brand:#0f766e; --brandbg:#ccfbf1; --ok:#15803d; --okbg:#dcfce7; --warn:#b45309; --warnbg:#fef3c7; --sup:#6d28d9; --supbg:#ede9fe; }
* { box-sizing:border-box; }
html, body { height:100%; }
body { margin:0; font:15px/1.45 -apple-system, system-ui, sans-serif; background:var(--bg); color:var(--ink); display:flex; flex-direction:column; }
header { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px 22px 10px; }
.brand { display:flex; align-items:center; gap:10px; }
.logo { width:34px; height:34px; border-radius:9px; background:var(--brand); color:#fff; display:grid; place-items:center; font-weight:700; font-size:16px; }
h1 { font-size:20px; margin:0; letter-spacing:-.01em; } .tag { color:var(--muted); font-size:13px; }
.powered { color:var(--muted); font-size:12.5px; text-align:right; } .powered b { color:var(--ink); font-weight:600; }
.stepper { display:flex; gap:4px; padding:0 22px 12px; }
.step { flex:1; text-align:center; font-size:12px; color:var(--muted); padding:7px 2px; border-radius:8px; background:#e5e7eb; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; transition:background .3s, color .3s; }
.step.done { background:var(--brandbg); color:var(--brand); }
.step.now { background:var(--brand); color:#fff; font-weight:600; }
main { flex:1; min-height:0; display:grid; grid-template-columns:minmax(0,1.1fr) minmax(0,1fr); gap:14px; padding:0 22px 14px; }
.col { display:flex; flex-direction:column; gap:14px; min-height:0; min-width:0; }
.card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 16px; min-width:0; }
.card h2 { font-size:11.5px; text-transform:uppercase; letter-spacing:.07em; color:var(--muted); margin:0 0 10px; display:flex; justify-content:space-between; gap:8px; }
.card h2 span { text-transform:none; letter-spacing:0; font-weight:500; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.empty { color:#9ca3af; font-size:14px; }
.line { flex:1; min-height:0; display:flex; flex-direction:column; }
.transcript { flex:1; min-height:120px; overflow-y:auto; display:flex; flex-direction:column; gap:8px; padding-right:4px; }
.bubble { max-width:86%; padding:8px 12px; border-radius:12px; font-size:14.5px; }
.bubble.agent { align-self:flex-start; background:#f3f4f6; border-top-left-radius:4px; }
.bubble.supplier { align-self:flex-end; background:var(--supbg); color:#3b0764; border-top-right-radius:4px; }
.bubble.confirm { align-self:stretch; max-width:none; background:var(--okbg); color:var(--ok); font-weight:600; }
.who { font-size:11px; color:var(--muted); margin-bottom:2px; }
.say { display:flex; gap:8px; margin-top:10px; }
.say input { flex:1; min-width:0; border:1.5px solid var(--sup); border-radius:10px; padding:10px 12px; font:inherit; outline:none; }
.say button { border:0; border-radius:10px; padding:0 16px; background:var(--sup); color:#fff; font:inherit; font-weight:600; cursor:pointer; }
.kv { display:flex; flex-wrap:wrap; gap:6px 14px; font-size:14px; }
.items { font-size:16px; font-weight:600; margin-bottom:6px; }
.chip { display:inline-block; font-size:11.5px; font-weight:600; padding:2px 8px; border-radius:99px; vertical-align:1px; }
.chip.warn { background:var(--warnbg); color:var(--warn); } .chip.bad { background:#fee2e2; color:#b91c1c; } .chip.ok { background:var(--okbg); color:var(--ok); } .chip.unk { background:#f3f4f6; color:var(--muted); } .chip.med { background:#e0f2fe; color:#0369a1; }
.list { display:flex; flex-direction:column; }
.li { display:flex; align-items:center; gap:10px; padding:7px 0; border-top:1px solid var(--line); font-size:14px; min-width:0; }
.li:first-child { border-top:0; padding-top:0; }
.li .n { width:20px; height:20px; border-radius:6px; background:#f3f4f6; color:var(--muted); font-size:12px; display:grid; place-items:center; flex:none; }
.li .name { flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.li .right { flex:none; font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums; }
.li.active { background:var(--supbg); margin:0 -8px; padding-left:8px; padding-right:8px; border-radius:8px; }
.li.active .n { background:var(--sup); color:#fff; }
.li.demoted { opacity:.8; } .li.demoted .right { max-width:50%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:#b91c1c; }
.li.long .right { color:var(--warn); font-weight:600; }
.order .price { font-size:24px; font-weight:700; letter-spacing:-.01em; }
.order .sub { color:var(--muted); font-size:13.5px; margin-bottom:10px; }
.doc { display:flex; gap:8px; align-items:flex-start; font-size:14px; padding:4px 0; }
.tick { width:18px; height:18px; flex:none; border-radius:50%; border:1.5px solid #d1d5db; margin-top:1px; display:grid; place-items:center; font-size:11px; color:#fff; transition:all .3s; }
.tick.on { background:var(--ok); border-color:var(--ok); }
.fb { background:#fffbeb; border:1px solid #fde68a; border-radius:10px; padding:8px 12px; margin-bottom:10px; font-size:14px; } .fb b { color:#d97706; letter-spacing:1px; } .fb .small { font-size:12px; color:var(--muted); }
.done-banner { background:var(--ok); color:#fff; border-radius:10px; padding:10px 12px; font-weight:600; margin-bottom:10px; }
footer { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:9px 22px; background:var(--card); border-top:1px solid var(--line); font-size:13px; color:var(--muted); }
footer b { color:var(--ink); }
.learn { display:flex; gap:16px; flex-wrap:wrap; }
.learn .up { color:var(--ok); font-weight:700; }
.reset { background:none; border:0; color:#d1d5db; font:inherit; font-size:12px; cursor:pointer; }
@media (max-width:820px) { main { grid-template-columns:minmax(0,1fr); } body { height:auto; } .line { min-height:320px; } }
</style>
</head>
<body>
<header>
  <div class="brand"><div class="logo">SR</div><div><h1>Supply Runner</h1><div class="tag">Humanitarian supplies, from request to signed order</div></div></div>
  <div class="powered">Google Maps via <b>Apify</b> · open models on <b>Featherless</b><br>tracked and improved with <b>PostHog</b></div>
</header>
<div class="stepper" id="stepper"></div>
<main>
  <div class="col">
    <div class="card line">
      <h2>Supplier chat <span id="lineName"></span></h2>
      <div class="transcript" id="transcript"></div>
      <div class="say" id="sayBox" style="display:none"><input id="sayInput" placeholder="Answer as the supplier" autocomplete="off"><button onclick="say()">Send</button></div>
    </div>
    <div class="card order" id="order" style="display:none"></div>
  </div>
  <div class="col">
    <div class="card" id="request"></div>
    <div class="card"><h2>Suppliers near Prague <span id="supCount"></span></h2><div class="list" id="suppliers"></div></div>
    <div class="card"><h2>Paperwork for these goods <span id="longest"></span></h2><div class="list" id="paperwork"></div></div>
  </div>
</main>
<footer>
  <div class="learn" id="learn"></div>
  <button class="reset" onclick="reset()" title="Reset demo">reset</button>
</footer>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const STEPS = ["Request", "Suppliers", "Paperwork", "Supplier", "Offer", "Documents", "Order", "Feedback"];
let state = null, lastTranscript = "";

async function poll() {
  try { state = await (await fetch("/api/procure")).json(); render(); } catch (e) {}
  setTimeout(poll, 1000);
}
async function reset() { if (confirm("Reset the demo?")) { await fetch("/api/procure/reset", { method: "POST" }); lastTranscript = ""; } }
function liveCall() { return (state?.calls || []).slice().reverse().find(c => !["done", "finishing", "no answer", "failed"].includes(c.status)); }
async function say() {
  const call = liveCall(), input = $("sayInput"), text = input.value.trim();
  if (!call || !text) return;
  input.value = "";
  await fetch(`/api/procure/call/${call.id}/say`, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ text }) });
}
$("sayInput").addEventListener("keydown", e => { if (e.key === "Enter") say(); });

function progress() {
  const s = state, o = s.order;
  if (s.stage === "closed") return 8;
  if (s.stage === "feedback") return 7;
  if (o?.status === "ordered") return 6;
  if (o?.status === "documents") return 5;
  if (o) return o.status === "negotiating" ? 3 : 4;
  if (s.calls.length) return 3;
  if (s.compliance) return 3;
  if (s.suppliers.length) return 2;
  if (s.request) return 1;
  return s.stage === "working" ? 0 : -1;
}

function short(name) { return name.split(/\s+[-–|]\s+|,\s/)[0]; }

function render() {
  const p = progress();
  $("stepper").innerHTML = STEPS.map((t, i) => `<div class="step ${i < p ? "done" : i === p ? "now" : ""}">${t}</div>`).join("");
  renderRequest(); renderSuppliers(); renderPaperwork(); renderLine(); renderOrder(); renderLearn();
}

function renderRequest() {
  const r = state.request;
  if (!r) { $("request").innerHTML = `<h2>Request</h2><div class="empty">${state.stage === "working" ? "Reading the request…" : "Waiting for a message on Telegram"}</div>`; return; }
  $("request").innerHTML = `<h2>Request</h2>
    <div class="items">${r.items.map(i => `${esc(i.quantity ?? "")} ${esc(i.name)} <span class="chip ${i.category === "dual_use" ? "warn" : "med"}">${i.category === "dual_use" ? "dual-use" : "medical"}</span>`).join("<br>")}</div>
    <div class="kv"><span>To <b>${esc(r.destination || "?")}</b></span><span>By <b>${esc(r.deadline || "?")}</b></span><span>${r.own_transport ? "Own van" : "Transport not stated"}</span></div>`;
}

function renderSuppliers() {
  const list = state.suppliers, active = state.order?.supplier_id || liveCall()?.supplier_id || state.calls.at(-1)?.supplier_id;
  $("supCount").textContent = list.length ? `${list.length} shortlisted` : "";
  if (!list.length) { $("suppliers").innerHTML = `<div class="empty">${state.request ? "Searching Google Maps…" : "Ranked by rating, reviews and reachability"}</div>`; return; }
  $("suppliers").innerHTML = list.map((s, n) => `<div class="li ${s.id === active ? "active" : ""}">
    <span class="n">${n + 1}</span><span class="name"><b>${esc(short(s.name))}</b> <span class="chip ${s.category === "dual_use" ? "warn" : "med"}">${s.category === "dual_use" ? "dual-use" : "medical"}</span></span>
    ${s.ours ? `<span class="chip ${s.ours.rating >= 4 ? "ok" : s.ours.rating <= 2 ? "bad" : "unk"}" title="${esc(s.ours.last_comment)}">ours ${esc(s.ours.rating)}/5</span>` : ""}<span class="right">${s.price != null ? `<b style="color:var(--ink)">${esc(s.price)} ${esc(s.currency || "")}</b> · ` : ""}${s.rating ? `${s.rating}★ (${s.reviews})` : ""}</span></div>`).join("")
    + (state.demoted || []).map(d => `<div class="li demoted"><span class="n">-</span><span class="name"><s>${esc(short(d.name))}</s> <span class="chip bad">ours ${esc(d.ours.rating)}/5</span></span><span class="right" title="${esc(d.ours.last_comment)}">left out: ${esc(d.ours.last_comment)}</span></div>`).join("");
}

function renderPaperwork() {
  const c = state.compliance;
  if (!c) { $("paperwork").innerHTML = `<div class="empty">Export, import and transport rules for the exact goods</div>`; $("longest").textContent = ""; return; }
  const rules = c.checklist.filter(r => r.applies).sort((a, b) => b.lead_time_days - a.lead_time_days);
  $("longest").textContent = `longest ~${c.longest_lead_days} days`;
  $("paperwork").innerHTML = rules.map(r => `<div class="li ${r.lead_time_days === c.longest_lead_days && r.lead_time_days >= 7 ? "long" : ""}">
    <span class="name" title="${esc(r.title)}">${esc(r.title)}</span><span class="right">${r.lead_time_days ? `~${esc(r.lead_time_days)} d` : "with goods"}</span></div>`).join("")
    + `<div class="li"><span class="name" style="font-size:12px;color:var(--muted);white-space:normal">Curated rules with sources. A checklist, not legal advice.</span></div>`;
}

function renderLine() {
  const call = liveCall() || state.calls.at(-1);
  $("lineName").textContent = call ? short(call.supplier_name) : "";
  $("sayBox").style.display = liveCall() ? "" : "none";
  const order = state.order;
  const html = !call ? `<div class="empty">When the coordinator asks for a quote, the agent talks to the supplier here.</div>`
    : call.transcript.map((t, i) => {
        const confirm = order?.status === "ordered" && i === call.transcript.length - 1 && t.who === "agent";
        return `<div class="bubble ${confirm ? "confirm" : t.who}"><div class="who">${t.who === "agent" ? "Agent" : "Supplier"}</div>${esc(t.text)}</div>`;
      }).join("") || `<div class="empty">Connecting…</div>`;
  if (html !== lastTranscript) { lastTranscript = html; $("transcript").innerHTML = html; }
  $("transcript").scrollTop = $("transcript").scrollHeight;
  if (liveCall() && document.activeElement !== $("sayInput")) $("sayInput").focus();
}

function renderOrder() {
  const o = state.order, el = $("order");
  if (!o) { el.style.display = "none"; return; }
  el.style.display = "";
  const label = { offer: "Offer sent to the coordinator", negotiating: "Negotiating", documents: "Collecting documents", ordered: "Confirmed" }[o.status] || o.status;
  const price = o.unit_price != null ? `${o.total ?? o.unit_price} ${esc(o.currency)}` : "Price not confirmed";
  el.innerHTML = `<h2>Order <span>${esc(label)}</span></h2>
    ${o.status === "ordered" ? `<div class="done-banner">Order ${esc(o.number)} confirmed · pickup ${esc(o.pickup || "agreed")}</div>` : ""}
    <div class="price">${price}</div>
    <div class="sub">${esc(short(o.supplier_name))} · ${esc(o.items)}${o.unit_price != null && o.quantity ? ` · ${esc(o.unit_price)} × ${esc(o.quantity)}` : ""}${o.lead_time_days != null ? ` · ready in ${esc(o.lead_time_days)} d` : ""}</div>
    ${o.feedback ? `<div class="fb">Coordinator feedback: <b>${"★".repeat(o.feedback.rating)}${"☆".repeat(5 - o.feedback.rating)}</b> ${esc(o.feedback.comment)}<div class="small">Saved. It changes how this supplier ranks next time.</div></div>` : state.stage === "feedback" ? `<div class="fb">Waiting for the coordinator's 1 to 5 rating after pickup</div>` : ""}
    ${o.documents.map(d => `<div class="doc"><span class="tick ${d.received ? "on" : ""}">${d.received ? "✓" : ""}</span><span>${esc(d.name)}</span></div>`).join("")}`;
}

function renderLearn() {
  const rows = state.eval || [];
  if (rows.length < 2) { $("learn").innerHTML = ""; return; }
  const a = rows[0].holdout, b = rows.at(-1).holdout, pct = v => Math.round(v * 100) + "%";
  $("learn").innerHTML = `<span><b>Self-improving offer reader</b> ${esc(rows[0].version)} to ${esc(rows.at(-1).version)}, on unseen offers:</span>
    <span>traps caught from ${pct(a.trap_recall)} to <span class="up">${pct(b.trap_recall)}</span></span>
    <span>right pick from ${pct(a.pick_accuracy)} to <span class="up">${pct(b.pick_accuracy)}</span></span>`;
}

poll();
</script>
</body>
</html>
