<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Supply Runner</title>
<style>
:root { --bg:#f3f4f6; --card:#fff; --ink:#111827; --muted:#6b7280; --line:#e5e7eb; --brand:#0f766e; --brandbg:#ccfbf1; --ok:#15803d; --okbg:#dcfce7; --warn:#b45309; --warnbg:#fef3c7; --bad:#b91c1c; --badbg:#fee2e2; --sup:#6d28d9; --supbg:#ede9fe; }
* { box-sizing:border-box; }
html, body { height:100%; }
body { margin:0; font:17px/1.45 -apple-system, system-ui, sans-serif; background:var(--bg); color:var(--ink); display:flex; flex-direction:column; }
header { display:flex; align-items:center; gap:12px; padding:20px 28px 14px; }
.logo { width:40px; height:40px; border-radius:10px; background:var(--brand); color:#fff; display:grid; place-items:center; font-weight:700; font-size:18px; }
h1 { font-size:24px; margin:0; letter-spacing:-.01em; }
.stepper { display:flex; gap:6px; padding:0 28px 18px; }
.step { flex:1; text-align:center; font-size:14px; color:var(--muted); padding:9px 4px; border-radius:10px; background:#e5e7eb; transition:all .3s; }
.step.done { background:var(--brandbg); color:var(--brand); }
.step.now { background:var(--brand); color:#fff; font-weight:600; }
main { flex:1; min-height:0; padding:0 28px 18px; display:flex; }
.scene { flex:1; min-height:0; background:var(--card); border:1px solid var(--line); border-radius:18px; padding:26px 28px; display:flex; flex-direction:column; gap:16px; overflow:hidden; }
.title { font-size:13px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); font-weight:600; }
.big { font-size:28px; font-weight:700; letter-spacing:-.01em; line-height:1.25; }
.muted { color:var(--muted); }
.center { margin:auto; text-align:center; color:var(--muted); font-size:20px; }
.sup { display:flex; align-items:center; gap:14px; padding:14px 16px; border-radius:12px; background:#f9fafb; font-size:19px; }
.sup .n { width:30px; height:30px; border-radius:8px; background:var(--brand); color:#fff; font-weight:700; display:grid; place-items:center; flex:none; font-size:15px; }
.sup .name { flex:1; min-width:0; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.sup .stars { color:var(--muted); font-size:16px; flex:none; }
.sup.out { background:var(--badbg); }
.sup.out .n { background:var(--bad); }
.sup.out .name { text-decoration:line-through; color:#7f1d1d; }
.chip { font-size:14px; font-weight:600; padding:3px 10px; border-radius:99px; flex:none; }
.chip.ok { background:var(--okbg); color:var(--ok); } .chip.bad { background:#fff; color:var(--bad); }
.alert { background:var(--warnbg); color:#78350f; border-radius:12px; padding:14px 16px; font-size:18px; }
.alert b { color:var(--warn); }
.chat { flex:1; min-height:0; overflow-y:auto; display:flex; flex-direction:column; gap:12px; }
.bubble { max-width:80%; padding:12px 16px; border-radius:16px; font-size:18px; }
.bubble.agent { align-self:flex-start; background:#f3f4f6; border-top-left-radius:4px; }
.bubble.supplier { align-self:flex-end; background:var(--supbg); color:#3b0764; border-top-right-radius:4px; }
.who { font-size:12px; color:var(--muted); margin-bottom:2px; }
.say { display:flex; gap:10px; }
.say input { flex:1; min-width:0; border:2px solid var(--sup); border-radius:12px; padding:14px 16px; font:inherit; outline:none; }
.say button.ghost { background:var(--supbg); color:var(--sup); }
.say button { border:0; border-radius:12px; padding:0 22px; background:var(--sup); color:#fff; font:inherit; font-weight:600; cursor:pointer; }
.price { font-size:44px; font-weight:800; letter-spacing:-.02em; }
.banner { background:var(--ok); color:#fff; border-radius:12px; padding:14px 16px; font-size:20px; font-weight:700; }
.docs { display:flex; flex-direction:column; gap:10px; }
.doc { display:flex; gap:12px; align-items:center; font-size:18px; }
.tick { width:26px; height:26px; flex:none; border-radius:50%; border:2px solid #d1d5db; display:grid; place-items:center; font-size:15px; color:#fff; transition:all .3s; }
.tick.on { background:var(--ok); border-color:var(--ok); }
.rating { font-size:64px; color:#f59e0b; letter-spacing:6px; }
footer { display:flex; justify-content:space-between; align-items:center; padding:8px 28px 12px; font-size:13px; color:var(--muted); }
footer b { color:var(--ink); font-weight:600; }
.reset { background:none; border:0; color:#d1d5db; font:inherit; font-size:12px; cursor:pointer; }
</style>
</head>
<body>
<header><div class="logo">SR</div><h1>Supply Runner</h1></header>
<div class="stepper" id="stepper"></div>
<main><div class="scene" id="scene"></div></main>
<div class="say" id="sayBox" style="display:none;padding:0 28px 18px"><input id="sayInput" placeholder="Reply as the supplier" autocomplete="off"><button class="ghost" onclick="example()" title="Fill in an example reply">Example</button><button onclick="say()">Send</button></div>
<footer><span><b>Apify</b> · <b>Featherless</b> · <b>PostHog</b></span><button class="reset" onclick="reset()">reset</button></footer>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const STEPS = ["Request", "Suppliers", "Quote", "Order", "Rating"];
const S = new URLSearchParams(location.search).get("s"), Q = S ? `?s=${encodeURIComponent(S)}` : "";
const EXAMPLE_REPLY = "2 in stock, 21900 CZK each, pickup in 2 days. Invoice and CE declaration, no export classification.";
function example() { $("sayInput").value = EXAMPLE_REPLY; $("sayInput").focus(); }
let state = null, lastHtml = "";

async function poll() {
  try { state = await (await fetch(`/api/procure${Q}`)).json(); render(); } catch (e) {}
  setTimeout(poll, 1000);
}
async function reset() { if (confirm("Reset the demo?")) { await fetch(`/api/procure/reset${Q}`, { method: "POST" }); lastHtml = ""; } }
function liveCall() { return (state?.calls || []).slice().reverse().find(c => !["done", "no answer", "failed"].includes(c.status)); }
async function say() {
  const call = liveCall(), input = $("sayInput"), text = input.value.trim();
  if (!call || !text) return;
  input.value = "";
  await fetch(`/api/procure/call/${call.id}/say${Q}`, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ text }) });
}
$("sayInput").addEventListener("keydown", e => { if (e.key === "Enter") say(); });
const short = name => name.split(/\s+[-–|]\s+|,\s/)[0].split(/\s+/).slice(0, 4).join(" ");

function step() {
  const s = state, o = s.order;
  if (s.stage === "feedback" || s.stage === "closed") return 4;
  if (o && o.status !== "negotiating") return 3;
  if (s.calls.length) return 2;
  if (s.suppliers.length) return 1;
  return s.request || s.stage === "working" ? 0 : -1;
}

function render() {
  const p = step();
  $("stepper").innerHTML = STEPS.map((t, i) => `<div class="step ${i < p || (i === 4 && state.stage === "closed") ? "done" : i === p ? "now" : ""}">${t}</div>`).join("");
  const html = [idle, request, suppliers, quote, order, rating][p + 1]();
  if (html !== lastHtml) { lastHtml = html; $("scene").innerHTML = html; const c = document.querySelector(".chat"); if (c) c.scrollTop = c.scrollHeight; }
  const live = p === 2 && liveCall() && liveCall().status !== "finishing";
  $("sayBox").style.display = live ? "flex" : "none";
  if (live && !S && document.activeElement !== $("sayInput")) $("sayInput").focus();
}

const idle = () => `<div class="center">Waiting for a request</div>`;

function request() {
  const r = state.request;
  if (!r) return `<div class="center">Reading the request…</div>`;
  return `<div class="title">Request</div>
    <div class="big">${r.items.map(i => `${esc(i.quantity ?? "")} × ${esc(i.name)}`).join("<br>")}</div>
    <div class="muted">${[r.destination && `To ${esc(r.destination)}`, r.deadline && `by ${esc(r.deadline)}`, r.own_transport && "own van"].filter(Boolean).join(" · ")}</div>
    <div class="center" style="font-size:17px">Searching suppliers…</div>`;
}

function suppliers() {
  const top = state.suppliers.slice(0, 3), c = state.compliance;
  const longest = c && c.checklist.filter(r => r.applies).sort((a, b) => b.lead_time_days - a.lead_time_days)[0];
  return `<div class="title">Best suppliers near Prague</div>
    ${top.map((s, n) => `<div class="sup"><span class="n">${n + 1}</span><span class="name">${esc(short(s.name))}</span>
      ${s.ours ? `<span class="chip ${s.ours.rating >= 4 ? "ok" : "bad"}">our orders ${esc(s.ours.rating)}/5</span>` : ""}
      <span class="stars">${s.rating ? `${s.rating}★` : ""}</span></div>`).join("")}
    ${(state.demoted || []).map(d => `<div class="sup out"><span class="n">✕</span><span class="name">${esc(short(d.name))}</span><span class="chip bad">${esc(d.ours.last_comment.split(",")[0])}</span></div>`).join("")}
    ${longest ? `<div class="alert">⚠ <b>${esc(longest.title)}</b> · about ${esc(longest.lead_time_days)} days</div>` : `<div class="muted">Checking export and import rules…</div>`}`;
}

function quote() {
  const call = liveCall() || state.calls.at(-1);
  return `<div class="title">Asking ${esc(short(call.supplier_name))} for a quote</div>
    <div class="chat">${call.transcript.map(t => `<div class="bubble ${t.who}"><div class="who">${t.who === "agent" ? "Agent" : "Supplier"}</div>${esc(t.text)}</div>`).join("") || `<div class="center">Writing to the supplier…</div>`}</div>`;
}

function order() {
  const o = state.order, ordered = o.status === "ordered";
  return `${ordered ? `<div class="banner">✓ Order ${esc(o.number)} confirmed · pickup ${esc(o.pickup || "agreed")}</div>` : `<div class="title">${o.status === "offer" ? "Offer from" : "Order with"} ${esc(short(o.supplier_name))}</div>`}
    <div class="price">${o.total != null ? `${esc(o.total)} ${esc(o.currency)}` : "Price not confirmed"}</div>
    <div class="muted">${esc(o.items)}${o.lead_time_days != null ? ` · pickup in ${esc(o.lead_time_days)} d` : ""}</div>
    ${o.status === "offer" ? `<div class="center" style="font-size:17px">Waiting for the coordinator to accept…</div>` : `<div class="docs">${o.documents.map(d => `<div class="doc"><span class="tick ${d.received ? "on" : ""}">${d.received ? "✓" : ""}</span><span>${esc(d.name.split(" (")[0])}</span></div>`).join("")}</div>`}`;
}

function rating() {
  const o = state.order, f = o.feedback;
  return `<div class="banner">✓ Order ${esc(o.number)} delivered by ${esc(short(o.supplier_name))}</div>
    ${f ? `<div class="center"><div class="rating">${"★".repeat(f.rating)}${"☆".repeat(5 - f.rating)}</div><div style="font-size:22px;color:var(--ink);font-weight:600">Saved. Next time the ranking uses it.</div></div>`
        : `<div class="center">Waiting for the coordinator's rating…</div>`}`;
}

poll();
</script>
</body>
</html>
